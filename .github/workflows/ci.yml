name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm --prefix mcp-server ci

      - name: Lint and type-check
        run: |
          ruff check .
          ruff format --check .
          npm --prefix mcp-server run typecheck

      - name: Generate data, ingest, dbt source freshness + dbt build, data-quality report
        run: retail pipeline

      - name: Validate the semantic layer with MetricFlow
        working-directory: dbt
        run: mf validate-configs

      - name: MCP server tests (in-memory MCP client)
        run: npm --prefix mcp-server test

      - name: Python tests (unit, pipeline, clean-data run, MetricFlow parity)
        run: python -m pytest -q

      - name: Evaluation, no-model path (semantic layer vs reference answers)
        run: retail eval --oracle

      - name: Weekly campaign report (template writer) with grounding check
        run: retail campaign-report --week 2026-W13 --no-model

      - name: Upload data-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dq-report
          path: build/dq/
